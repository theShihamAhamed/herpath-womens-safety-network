name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Expo SDK dependency compatibility
        run: npx --no-install expo install --check --json

      - name: Resolve Expo public configuration
        run: >-
          node -e "const { execFileSync } = require('node:child_process');
          const config = JSON.parse(execFileSync('./node_modules/.bin/expo', ['config', '--json'], { encoding: 'utf8' }));
          if (config.sdkVersion !== '57.0.0') throw new Error('Expected Expo SDK 57 configuration');
          console.log('Expo SDK ' + config.sdkVersion + ' configuration resolved');"

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
